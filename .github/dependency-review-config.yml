# Configuration for actions/dependency-review-action
# See https://github.com/actions/dependency-review-action

# Fail on high severity vulnerabilities
fail-on-severity: high

# Allow specific licenses
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - CC0-1.0

# Deny specific licenses
deny-licenses:
  - GPL-2.0-only
  - GPL-3.0-only
  - AGPL-3.0-only

# Private packages are allowed (tap doesn't have private deps)
private-packages-allowed: true