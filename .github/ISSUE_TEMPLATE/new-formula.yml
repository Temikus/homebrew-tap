## Platform Support

- [ ] macOS (Apple Silicon)
- [ ] macOS (Intel)
- [ ] Linux (ARM64)
- [ ] Linux (x86_64)

## Installation Method

- [ ] Pre-built binaries from GitHub Releases (preferred)
- [ ] Build from source
- [ ] Other: <!-- specify -->

## Checklist

- [ ] Upstream provides pre-built binaries for all platforms above
- [ ] Upstream publishes `.sha256` checksum files alongside releases
- [ ] Binary name doesn't conflict with homebrew-core
- [ ] Formula includes `livecheck` block for auto-bump
- [ ] Formula includes test block

