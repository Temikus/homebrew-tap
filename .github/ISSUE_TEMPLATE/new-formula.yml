## Formula Information

- **Name**: <!-- e.g., fd, ripgrep, starship -->
- **Upstream Repository**: <!-- e.g., https://github.com/sharkdp/fd -->
- **License**: <!-- SPDX identifier, e.g., MIT, Apache-2.0 -->
