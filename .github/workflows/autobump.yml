name: Auto-bump formulae

on:
  workflow_dispatch:
    inputs:
      formulae:
        description: Space-separated list of formulae to check (empty = all)
        required: false
  schedule:
    # Daily at 04:23
    - cron: "23 4 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  autobump:
    name: Auto-bump
    if: github.repository == 'temikus/homebrew-tap'
    runs-on: ubuntu-latest
    steps:
      # An optional PAT makes the resulting PR trigger CI. Pushes and PRs
      # authored by GITHUB_TOKEN do not start workflow runs, so without it the
      # bump PR sits without the `ci` status branch protection requires.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUTOBUMP_TOKEN || github.token }}

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump formulae and open PRs
        env:
          GH_TOKEN: ${{ secrets.AUTOBUMP_TOKEN || github.token }}
          INPUT_FORMULAE: ${{ github.event.inputs.formulae }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_FORMULAE}" ]]; then
            read -ra formulae <<<"${INPUT_FORMULAE}"
          else
            formulae=()
            while IFS= read -r f; do
              formulae+=("${f}")
            done < <(find Formula -name '*.rb' -exec basename {} .rb \;)
          fi

          echo "Checking: ${formulae[*]}"
          failed=""
          base_sha="$(git rev-parse HEAD)"

          for formula in "${formulae[@]}"; do
            echo "::group::${formula}"
            git checkout -f "${base_sha}"

            if ! ./scripts/bump-formula.sh "${formula}"; then
              failed="${failed} ${formula}"
              echo "::endgroup::"
              continue
            fi

            if git diff --quiet -- "Formula/${formula}.rb"; then
              echo "${formula} already up to date"
              echo "::endgroup::"
              continue
            fi

            tag="$(sed -n 's|.*/releases/download/\([^/]*\)/.*|\1|p' "Formula/${formula}.rb" | head -1)"
            branch="autobump/${formula}-${tag}"

            if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              echo "${branch} already exists, skipping"
              echo "::endgroup::"
              continue
            fi

            git checkout -b "${branch}"
            git commit -m "${formula} ${tag}" -- "Formula/${formula}.rb"
            git push origin "${branch}"
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "${formula} ${tag}" \
              --body "Automated bump of \`${formula}\` to \`${tag}\`. Checksums verified against upstream release assets."
            echo "::endgroup::"
          done

          if [[ -n "${failed}" ]]; then
            echo "Failed to bump:${failed}" >&2
            exit 1
          fi
