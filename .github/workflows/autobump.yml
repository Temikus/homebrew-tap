name: Auto-bump formulae and casks

on:
  workflow_dispatch:
    inputs:
      formulae:
        description: Space-separated formulae or casks to check (empty = all)
        required: false
  schedule:
    # Daily at 04:23
    - cron: "23 4 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  autobump:
    name: Auto-bump
    if: github.repository == 'temikus/homebrew-tap'
    runs-on: ubuntu-latest
    steps:
      # An optional PAT makes the resulting PR trigger CI. Pushes and PRs
      # authored by GITHUB_TOKEN do not start workflow runs, so without it the
      # bump PR sits without the `ci` status branch protection requires.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUTOBUMP_TOKEN || github.token }}

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump formulae and open PRs
        env:
          GH_TOKEN: ${{ secrets.AUTOBUMP_TOKEN || github.token }}
          INPUT_FORMULAE: ${{ github.event.inputs.formulae }}
        run: |
          set -euo pipefail

          # Names resolve to Formula/<name>.rb first, then Casks/<name>.rb
          if [[ -n "${INPUT_FORMULAE}" ]]; then
            read -ra names <<<"${INPUT_FORMULAE}"
            files=()
            for name in "${names[@]}"; do
              if [[ -f "Formula/${name}.rb" ]]; then
                files+=("Formula/${name}.rb")
              elif [[ -f "Casks/${name}.rb" ]]; then
                files+=("Casks/${name}.rb")
              else
                echo "No formula or cask named ${name}" >&2
                exit 1
              fi
            done
          else
            files=()
            while IFS= read -r f; do
              files+=("${f}")
            done < <(find Formula Casks -name '*.rb' 2>/dev/null | sort)
          fi

          # Close this repo's open autobump PRs for $1 except branch $2 (if
          # any), so only the newest version of a package has an open PR.
          # PRs are matched by title ("<name> <tag>") rather than branch prefix,
          # so `foo` never touches `foo-cli`'s PRs.
          supersede() {
            local name="$1" keep="${2:-}" reason="$3" numbers number
            if ! numbers="$(gh pr list --state open --base main --limit 200 \
              --json number,headRefName,title,isCrossRepository \
              | jq -r --arg name "${name}" --arg keep "${keep}" '.[]
                  | select(.isCrossRepository | not)
                  | select(.headRefName | startswith("autobump/"))
                  | select(.headRefName != $keep)
                  | select((.title | split(" ")[0]) == $name)
                  | .number')"; then
              echo "::warning::Could not list superseded PRs for ${name}"
              return 0
            fi
            for number in ${numbers}; do
              echo "Closing #${number}: ${reason}"
              gh pr close "${number}" --delete-branch --comment "${reason}" \
                || echo "::warning::Could not close #${number}"
            done
          }

          echo "Checking: ${files[*]}"
          failed=""
          base_sha="$(git rev-parse HEAD)"

          for file in "${files[@]}"; do
            name="$(basename "${file}" .rb)"
            echo "::group::${file}"
            git checkout -f "${base_sha}"

            case "${file}" in
              Casks/*) bump=./scripts/bump-cask.sh ;;
              *) bump=./scripts/bump-formula.sh ;;
            esac

            if ! "${bump}" "${name}"; then
              failed="${failed} ${file}"
              echo "::endgroup::"
              continue
            fi

            if git diff --quiet -- "${file}"; then
              echo "${name} already up to date"
              supersede "${name}" "" "Superseded: \`${name}\` on \`main\` is already at the latest upstream release."
              echo "::endgroup::"
              continue
            fi

            case "${file}" in
              Casks/*) tag="$(./scripts/cask-tag.sh "${file}")" ;;
              *) tag="$(./scripts/formula-tag.sh "${file}")" ;;
            esac
            branch="autobump/${name}-${tag}"

            # A branch without a PR means an earlier `gh pr create` failed; retry it.
            # Closed or merged PRs count, so a rejected bump isn't reopened.
            if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              if [[ -n "$(gh pr list --head "${branch}" --state all --json number --jq '.[].number')" ]]; then
                echo "${branch} already has a PR, skipping"
                pr="$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')"
                if [[ -n "${pr}" ]]; then
                  supersede "${name}" "${branch}" "Superseded by #${pr} (\`${name}\` \`${tag}\`)."
                fi
                echo "::endgroup::"
                continue
              fi
              echo "${branch} exists without a PR, opening one"
            else
              git checkout -b "${branch}"
              git commit -m "${name} ${tag}" -- "${file}"
              git push origin "${branch}"
            fi

            if ! pr_url="$(gh pr create \
              --base main \
              --head "${branch}" \
              --title "${name} ${tag}" \
              --body "Automated bump of \`${name}\` to \`${tag}\`. Checksums verified against upstream release assets.")"; then
              failed="${failed} ${file}"
            else
              supersede "${name}" "${branch}" "Superseded by #${pr_url##*/} (\`${name}\` \`${tag}\`)."
            fi
            echo "::endgroup::"
          done

          if [[ -n "${failed}" ]]; then
            echo "Failed to bump:${failed}" >&2
            exit 1
          fi
