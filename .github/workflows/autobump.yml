name: Auto-bump formulae and casks

on:
  workflow_dispatch:
    inputs:
      formulae:
        description: Space-separated formulae or casks to check (empty = all)
        required: false
  schedule:
    # Daily at 04:23
    - cron: "23 4 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  autobump:
    name: Auto-bump
    if: github.repository == 'temikus/homebrew-tap'
    runs-on: ubuntu-latest
    steps:
      # An optional PAT makes the resulting PR trigger CI. Pushes and PRs
      # authored by GITHUB_TOKEN do not start workflow runs, so without it the
      # bump PR sits without the `ci` status branch protection requires.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUTOBUMP_TOKEN || github.token }}

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump formulae and open PRs
        env:
          GH_TOKEN: ${{ secrets.AUTOBUMP_TOKEN || github.token }}
          INPUT_FORMULAE: ${{ github.event.inputs.formulae }}
        run: |
          set -euo pipefail

          # Names resolve to Formula/<name>.rb first, then Casks/<name>.rb
          if [[ -n "${INPUT_FORMULAE}" ]]; then
            read -ra names <<<"${INPUT_FORMULAE}"
            files=()
            for name in "${names[@]}"; do
              if [[ -f "Formula/${name}.rb" ]]; then
                files+=("Formula/${name}.rb")
              elif [[ -f "Casks/${name}.rb" ]]; then
                files+=("Casks/${name}.rb")
              else
                echo "No formula or cask named ${name}" >&2
                exit 1
              fi
            done
          else
            files=()
            while IFS= read -r f; do
              files+=("${f}")
            done < <(find Formula Casks -name '*.rb' 2>/dev/null | sort)
          fi

          echo "Checking: ${files[*]}"
          failed=""
          base_sha="$(git rev-parse HEAD)"

          for file in "${files[@]}"; do
            name="$(basename "${file}" .rb)"
            echo "::group::${file}"
            git checkout -f "${base_sha}"

            case "${file}" in
              Casks/*) bump=./scripts/bump-cask.sh ;;
              *) bump=./scripts/bump-formula.sh ;;
            esac

            if ! "${bump}" "${name}"; then
              failed="${failed} ${file}"
              echo "::endgroup::"
              continue
            fi

            if git diff --quiet -- "${file}"; then
              echo "${name} already up to date"
              echo "::endgroup::"
              continue
            fi

            case "${file}" in
              Casks/*) tag="$(./scripts/cask-tag.sh "${file}")" ;;
              *) tag="$(sed -n 's|.*/releases/download/\([^/]*\)/.*|\1|p' "${file}" | head -1)" ;;
            esac
            branch="autobump/${name}-${tag}"

            # A branch without a PR means an earlier `gh pr create` failed; retry it.
            # Closed or merged PRs count, so a rejected bump isn't reopened.
            if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              if [[ -n "$(gh pr list --head "${branch}" --state all --json number --jq '.[].number')" ]]; then
                echo "${branch} already has a PR, skipping"
                echo "::endgroup::"
                continue
              fi
              echo "${branch} exists without a PR, opening one"
            else
              git checkout -b "${branch}"
              git commit -m "${name} ${tag}" -- "${file}"
              git push origin "${branch}"
            fi

            if ! gh pr create \
              --base main \
              --head "${branch}" \
              --title "${name} ${tag}" \
              --body "Automated bump of \`${name}\` to \`${tag}\`. Checksums verified against upstream release assets."; then
              failed="${failed} ${file}"
            fi
            echo "::endgroup::"
          done

          if [[ -n "${failed}" ]]; then
            echo "Failed to bump:${failed}" >&2
            exit 1
          fi
