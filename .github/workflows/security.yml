name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly on Sunday at 02:00
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  betterleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installed by version-pinned release tarball rather than a marketplace
      # action — avoids depending on a scanner action's mutable tags.
      - name: Install betterleaks
        run: |
          # renovate: datasource=github-releases depName=betterleaks/betterleaks
          VERSION="v1.9.0"
          curl -sSfL "https://github.com/betterleaks/betterleaks/releases/download/${VERSION}/betterleaks_${VERSION#v}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin betterleaks

      - name: Run betterleaks
        run: betterleaks git . --exit-code 1

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

  formula-audit:
    name: Formula Security Audit
    runs-on: macos-26
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478

      # setup-homebrew recognises a homebrew-* repo as a tap and symlinks the
      # workspace into Library/Taps itself, which is what makes the checkout
      # visible to brew audit, which only accepts formula names.
      - uses: actions/checkout@v7

      - name: Audit all formulae for security issues
        run: brew audit --strict --online --tap temikus/tap

  security:
    name: security
    # Aggregate gate, see the `ci` job in ci.yml. `skipped` is tolerated because
    # dependency-review only runs on pull_request.
    needs: [betterleaks, dependency-review, formula-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every security job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
