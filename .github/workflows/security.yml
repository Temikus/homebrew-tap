name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly on Sunday at 02:00
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

  formula-audit:
    name: Formula Security Audit
    runs-on: macos-26
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607

      # setup-homebrew recognises a homebrew-* repo as a tap and symlinks the
      # workspace into Library/Taps itself, which is what makes the checkout
      # visible to brew audit, which only accepts formula names.
      - uses: actions/checkout@v7

      - name: Audit all formulae for security issues
        run: brew audit --strict --online --tap temikus/tap

  checksum-verification:
    name: Checksum Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify all formula checksums match upstream
        run: |
          for formula in Formula/*.rb; do
            name=$(basename "$formula" .rb)
            tag=$(sed -n 's|.*/releases/download/\([^/]*\)/.*|\1|p' "$formula" | head -1)

            if [[ -z "$tag" ]]; then
              echo "Skipping $name (no tag found)"
              continue
            fi

            echo "Verifying $name @ $tag..."
            ./scripts/bump-formula.sh "$name" "$tag" --verify
          done

  security:
    name: security
    # Aggregate gate, see the `ci` job in ci.yml. `skipped` is tolerated because
    # dependency-review only runs on pull_request.
    needs: [secret-scan, dependency-review, formula-audit, checksum-verification]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every security job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
