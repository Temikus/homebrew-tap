name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly on Sunday at 02:00
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

  formula-audit:
    name: Formula Security Audit
    runs-on: macos-15
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - uses: actions/checkout@v4
        with:
          path: tap

      # brew audit only accepts formula names, so the checkout has to be visible
      # to Homebrew as an installed tap.
      - name: Link checkout as a tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/temikus/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE/tap" "$tap_dir"

      - name: Audit all formulae for security issues
        run: brew audit --strict --online --tap temikus/tap

  checksum-verification:
    name: Checksum Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify all formula checksums match upstream
        run: |
          for formula in Formula/*.rb; do
            name=$(basename "$formula" .rb)
            tag=$(sed -n 's|.*/releases/download/\([^/]*\)/.*|\1|p' "$formula" | head -1)

            if [[ -z "$tag" ]]; then
              echo "Skipping $name (no tag found)"
              continue
            fi

            echo "Verifying $name @ $tag..."
            ./scripts/bump-formula.sh "$name" "$tag" --verify
          done
