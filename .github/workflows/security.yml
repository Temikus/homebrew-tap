name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly on Sunday at 02:00
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  betterleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installed by version-pinned release tarball rather than a marketplace
      # action — avoids depending on a scanner action's mutable tags.
      - name: Install betterleaks
        run: |
          # renovate: datasource=github-releases depName=betterleaks/betterleaks
          VERSION="v1.9.0"
          curl -sSfL "https://github.com/betterleaks/betterleaks/releases/download/${VERSION}/betterleaks_${VERSION#v}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin betterleaks

      - name: Run betterleaks
        run: betterleaks git . --exit-code 1

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

  formula-audit:
    name: Formula Security Audit
    runs-on: macos-26
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478

      # setup-homebrew recognises a homebrew-* repo as a tap and symlinks the
      # workspace into Library/Taps itself, which is what makes the checkout
      # visible to brew audit, which only accepts formula names.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # --online fails any cask behind its upstream release, so a full-tap audit
      # turns unrelated PRs red while a bump is pending. PRs and pushes audit
      # only what changed; scheduled and manual runs audit the whole tap.
      - name: Select formulae and casks
        id: targets
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$EVENT" != "pull_request" && "$EVENT" != "push" ]] \
            || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=AMR "$BASE" HEAD -- 'Formula/*.rb' 'Casks/*.rb')
          echo "formulae=$(grep '^Formula/' <<<"$changed" | xargs -n1 basename -s .rb | xargs)" >> "$GITHUB_OUTPUT"
          echo "casks=$(grep '^Casks/' <<<"$changed" | xargs -n1 basename -s .rb | xargs)" >> "$GITHUB_OUTPUT"

      - name: Audit full tap
        if: steps.targets.outputs.full == 'true'
        run: brew audit --strict --online --tap temikus/tap

      - name: Audit changed formulae
        if: steps.targets.outputs.formulae != ''
        env:
          FORMULAE: ${{ steps.targets.outputs.formulae }}
        run: |
          for f in $FORMULAE; do
            brew audit --strict --online --formula "temikus/tap/$f"
          done

      - name: Audit changed casks
        if: steps.targets.outputs.casks != ''
        env:
          CASKS: ${{ steps.targets.outputs.casks }}
        run: |
          brew trust temikus/tap
          for c in $CASKS; do
            brew audit --strict --online --cask "temikus/tap/$c"
          done

  security:
    name: security
    # Aggregate gate, see the `ci` job in ci.yml. `skipped` is tolerated because
    # dependency-review only runs on pull_request.
    needs: [betterleaks, dependency-review, formula-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every security job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
