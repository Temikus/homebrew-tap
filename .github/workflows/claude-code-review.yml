name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Fork PRs get no secrets and no id-token from a `pull_request` event, so the
    # action cannot authenticate and the job fails unconditionally. Skip them here;
    # a maintainer can still trigger a review by commenting `@claude` (claude.yml
    # runs on issue_comment in base-repo context, where both are available).
    # Review only PRs authored by the owner or dependency bots.
    if: |
      github.event.pull_request.head.repo.fork == false &&
      contains(fromJSON('["Temikus", "dependabot[bot]", "renovate[bot]"]'), github.event.pull_request.user.login)

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        if: ${{ !startsWith(github.head_ref, 'autobump/') }}
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          allowed_bots: "dependabot[bot],renovate[bot]"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # Autobump PRs auto-merge, so Claude must explicitly approve them.
      # The plugin review above skips them as automated PRs.
      - name: Review bump
        id: bump-review
        if: startsWith(github.head_ref, 'autobump/')
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review autobump PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            It should only bump one Homebrew formula or cask to a new upstream release.
            Read the change with `gh pr diff ${{ github.event.pull_request.number }}`.

            Approve only if all of these hold:
            - Exactly one file changes, under Formula/ or Casks/.
            - Only `version`, `url`, and `sha256` lines change.
            - Every changed URL keeps the same host and upstream owner/repo, and only the version in it changes.
            - No dependency, install, test, caveats, or other logic is added or changed.

            Otherwise reject. In the summary, say what you checked and why you approved or rejected.
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"approve":{"type":"boolean"},"summary":{"type":"string"}},"required":["approve","summary"],"additionalProperties":false}'

      - name: Require Claude approval
        if: startsWith(github.head_ref, 'autobump/')
        env:
          VERDICT: ${{ steps.bump-review.outputs.structured_output }}
        run: ./scripts/claude-verdict.sh
