name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch upstream release churn
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  test-bot:
    name: brew test-bot (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # test-bot errors out instead of no-opping when a PR touches no formulae.
      - name: Detect formula changes
        id: formula-changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
            | grep -qE '^Formula/.*\.rb$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - run: brew test-bot --only-formulae --root-url=https://ghcr.io/v2/temikus/tap
        if: github.event_name == 'pull_request' && steps.formula-changes.outputs.changed == 'true'

  style:
    name: Style (brew style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - run: brew style .

  verify-bump:
    name: Verify bump script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Re-bump each formula to pinned tag and assert no drift
        run: |
          for formula in Formula/*.rb; do
            name=$(basename "$formula" .rb)
            tag="$(sed -n 's|.*/releases/download/\([^/]*\)/.*|\1|p' "$formula" | head -1)"
            if [[ -n "$tag" ]]; then
              echo "Checking $name @ $tag"
              ./scripts/bump-formula.sh "$name" "$tag" --verify
            else
              echo "Skipping $name (no tag found)"
            fi
          done