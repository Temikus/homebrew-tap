name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch upstream release churn
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  test-bot:
    name: brew test-bot (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f

      # setup-homebrew recognises a homebrew-* repo as a tap and symlinks the
      # workspace into Library/Taps itself, so no checkout path juggling here.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax --tap=temikus/tap

      # test-bot errors out instead of no-opping when a PR touches no formulae.
      - name: Detect formula changes
        id: formula-changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
            | grep -qE '^Formula/.*\.rb$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - run: brew test-bot --only-formulae --tap=temikus/tap --root-url=https://ghcr.io/v2/temikus/tap
        if: github.event_name == 'pull_request' && steps.formula-changes.outputs.changed == 'true'

      # test-bot downgrades install/test failures to "ignored" (exit 0) for
      # existing formulae without a bottle for the runner, i.e. all of ours.
      - name: Fail on ignored test-bot steps
        if: github.event_name == 'pull_request' && steps.formula-changes.outputs.changed == 'true'
        run: |
          if ! grep -qx 'All steps passed!' steps_output.txt; then
            cat steps_output.txt
            exit 1
          fi

  cask:
    name: Cask audit and install
    runs-on: macos-15
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select casks
        id: casks
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            files=$(git diff --name-only --diff-filter=AM "${{ github.event.pull_request.base.sha }}" HEAD -- 'Casks/*.rb')
          else
            files=$(ls Casks/*.rb 2>/dev/null || true)
          fi
          names=$(for f in $files; do basename "$f" .rb; done | xargs)
          echo "names=${names}" >> "$GITHUB_OUTPUT"

      - name: Audit and install
        if: steps.casks.outputs.names != ''
        env:
          CASKS: ${{ steps.casks.outputs.names }}
        run: |
          brew trust temikus/tap
          for cask in $CASKS; do
            for arch in arm intel; do
              brew audit --cask --strict --online --arch="$arch" "temikus/tap/$cask"
            done
            brew install --cask "temikus/tap/$cask"
            brew uninstall --cask "temikus/tap/$cask"
          done

  style:
    name: Style (brew style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f
      - run: brew style .

  verify-bump:
    name: Verify bump script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Re-bump each formula to pinned tag and assert no drift
        run: |
          for formula in Formula/*.rb; do
            name=$(basename "$formula" .rb)
            tag="$(sed -n 's|.*/releases/download/\([^/]*\)/.*|\1|p' "$formula" | head -1)"
            if [[ -n "$tag" ]]; then
              echo "Checking $name @ $tag"
              ./scripts/bump-formula.sh "$name" "$tag" --verify
            else
              echo "Skipping $name (no tag found)"
            fi
          done

      - name: Re-bump each cask to pinned version and assert no drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for cask in Casks/*.rb; do
            [[ -f "$cask" ]] || continue
            name=$(basename "$cask" .rb)
            tag=$(./scripts/cask-tag.sh "$cask")
            echo "Checking $name @ $tag"
            ./scripts/bump-cask.sh "$name" "$tag" --verify
          done

  ci:
    name: ci
    # Aggregate gate. Branch protection requires this one context, so adding or
    # dropping a matrix entry above never leaves protection referencing a job
    # that no longer reports.
    needs: [test-bot, cask, style, verify-bump]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every CI job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
